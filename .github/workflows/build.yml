name: Build Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore LocalDictate.sln
      - name: Build
        run: dotnet build LocalDictate.sln -c Release --no-restore
      - name: Publish
        run: >
          dotnet publish src/LocalDictate/LocalDictate.csproj
          -c Release -r win-x64 --self-contained false
          -o artifacts/LocalDictate
      - uses: actions/upload-artifact@v4
        with:
          name: LocalDictate-win-x64
          path: artifacts/LocalDictate
